# YaTung (ยาตรง) — รันทั้งระบบ: docker compose up -d --build
# เปิด tunnel สำหรับ LINE webhook:  docker compose --profile tunnel up -d
# เปิด Adminer ดูฐานข้อมูล:          docker compose --profile dev up -d
# ล้างฐานข้อมูลแล้ว seed ใหม่:         docker compose down -v && docker compose up -d --build

name: yatung

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Bangkok
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro   # รันครั้งเดียวตอน volume ยังว่าง
    ports:
      - "127.0.0.1:3306:3306"                      # dev เท่านั้น (ผูกเฉพาะเครื่องนี้) ลบออกตอนส่งงานได้
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  nodered:
    build: ./node-red
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Bangkok                 # สำคัญ: cron เตือนยาต้องใช้เวลาไทย
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      NODE_RED_CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET}
      NODE_RED_ADMIN_USER: ${NODE_RED_ADMIN_USER}
      NODE_RED_ADMIN_HASH: ${NODE_RED_ADMIN_HASH}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_MODEL_FALLBACK: ${LLM_MODEL_FALLBACK}
      AI_MOCK: ${AI_MOCK:-false}
      GEMINI_NO_RETRY: ${GEMINI_NO_RETRY:-false}   # เฉพาะทดสอบ: true = ไม่ลองใหม่/ไม่สลับรุ่น เพื่อคุมจำนวน request
      GEMINI_BREAKER_OPEN_MS: ${GEMINI_BREAKER_OPEN_MS:-}   # เฉพาะทดสอบ: เวลาเปิดเบรกเกอร์ (มิลลิวินาที) ว่าง = 10 นาที
      GEMINI_BREAKER_WINDOW_MS: ${GEMINI_BREAKER_WINDOW_MS:-}   # เฉพาะทดสอบ: หน้าต่างนับความล้มเหลว (มิลลิวินาที) ว่าง = 5 นาที
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}   # เฉพาะทดสอบกับ Gemini ปลอม (scripts/fake-gemini.js) ปล่อยว่างตามปกติ
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET}
      LINE_OA_BASIC_ID: ${LINE_OA_BASIC_ID:-}             # เช่น @014rktvr ใช้สร้างลิงก์ oaMessage
      LINE_API_BASE: ${LINE_API_BASE:-https://api.line.me}   # เฉพาะทดสอบ: ชี้ไป scripts/fake-line.js
      LINE_PUSH_MONTHLY_CAP: ${LINE_PUSH_MONTHLY_CAP:-200}
      LINE_PUSH_RESERVE: ${LINE_PUSH_RESERVE:-30}          # โควตาที่กันไว้ให้ข้อความแจ้งญาติ (kind=escalation)
      LINE_MASCOT_URL: ${LINE_MASCOT_URL:-}                # ว่าง = ${PUBLIC_BASE_URL}/line/mascot.png
      DEMO_MODE: ${DEMO_MODE:-false}
      REMINDER_CRON: ${REMINDER_CRON:-on}                  # off = ปิด cron ส่งเตือนอัตโนมัติ (เฉพาะทดสอบ scripts/test-day6b.sh)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    volumes:
      - ./node-red/data:/data          # flows.json อยู่ใน git, ส่วน flows_cred.json ถูก ignore
    ports:
      - "127.0.0.1:1880:1880"          # Node-RED editor (dev) — ผูกเฉพาะเครื่องนี้ ไม่ผ่าน nginx/tunnel

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - nodered
    ports:
      - "8080:80"                      # http://localhost:8080

  tunnel:
    image: ngrok/ngrok:3.39.11-alpine
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - frontend
    # โดเมนคงที่ของ ngrok (ฟรี 1 โดเมน) → https://${NGROK_DOMAIN} ชี้เข้า nginx ของ frontend
    # nginx ส่งต่อเฉพาะ /api และ /line/webhook; editor/admin API ของ Node-RED เข้าผ่าน tunnel ไม่ได้
    command: http frontend:80 --url=https://${NGROK_DOMAIN}
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "127.0.0.1:4040:4040"          # ngrok inspector (ดู request ที่ LINE ส่งมา)

  adminer:
    image: adminer:latest
    profiles: ["dev"]
    depends_on:
      - db
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  db_data:
