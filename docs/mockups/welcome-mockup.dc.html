<style>
body{margin:0}
a{color:#134e4a}a:hover{color:#0f766e}
/* ---------- ฉากเปิด (เล่นครั้งเดียว) ---------- */
@keyframes ytSky{from{opacity:0}to{opacity:1}}
@keyframes ytSunRise{0%{transform:translateY(190px) scale(.7);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
@keyframes ytHillUp{from{transform:translateY(140px)}to{transform:none}}
@keyframes ytDrop{0%{transform:translateY(-330px) scale(.9);opacity:0}8%{opacity:1}58%{transform:translateY(0) scale(1)}68%{transform:scale(1.14,.84)}80%{transform:scale(.95,1.07)}90%{transform:scale(1.02,.98)}100%{transform:none;opacity:1}}
@keyframes ytShadowIn{0%,40%{transform:scale(.2);opacity:0}58%{transform:scale(1.25);opacity:1}100%{transform:none;opacity:1}}
@keyframes ytTitle{0%{transform:translateY(24px) scale(.7);opacity:0}60%{transform:translateY(-4px) scale(1.06);opacity:1}100%{transform:none;opacity:1}}
@keyframes ytRise{from{transform:translateY(22px);opacity:0}to{transform:none;opacity:1}}
@keyframes ytPopIn{0%{transform:scale(0) rotate(-40deg);opacity:0}70%{transform:scale(1.25) rotate(8deg);opacity:1}100%{transform:none;opacity:1}}
@keyframes ytBubble{0%{transform:scale(0);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:none;opacity:1}}
@keyframes ytBubbleBob{0%,40%,100%{transform:none}8%,24%{transform:rotate(-4deg) scale(1.05)}16%,32%{transform:rotate(2deg)}}
@keyframes ytLetterIn{0%{transform:translateY(-46px) scale(.4) rotate(-24deg);opacity:0}60%{transform:translateY(6px) scale(1.18) rotate(6deg);opacity:1}100%{transform:none;opacity:1}}
@keyframes ytLetterJig{0%,80%,100%{transform:none}86%{transform:translateY(-12px) rotate(-7deg) scale(1.08)}92%{transform:translateY(0) rotate(4deg)}96%{transform:translateY(-3px)}}
.yt-letter{position:relative;display:inline-block;margin:0 -1px}
.yt-lb{position:absolute;left:0;top:0;color:#0f766e;text-shadow:0 1px 0 #0f766e,0 2px 0 #0f766e,0 3px 0 #0e6b64,0 4px 0 #0e6b64,0 5px 0 #115e59,0 6px 0 #115e59,0 7px 0 #134e4a,0 8px 0 #134e4a,0 16px 18px rgba(19,78,74,.35)}
.yt-lf{position:relative;background:linear-gradient(180deg,#5eead4 0%,#2dd4bf 30%,#14b8a6 55%,#0f766e 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
/* ---------- เคลื่อนไหวต่อเนื่อง ---------- */
@keyframes ytFloat{50%{transform:translateY(-6px)}}
@keyframes ytBlink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes ytWaveLoop{0%,40%,100%{transform:rotate(0)}8%,24%{transform:rotate(-20deg)}16%,32%{transform:rotate(4deg)}}
@keyframes ytHop{0%,80%,100%{transform:none}85%{transform:translateY(-26px) scale(.97,1.04)}90%{transform:translateY(0) scale(1.08,.92)}94%{transform:translateY(-7px)}97%{transform:none}}
@keyframes ytHopShadow{0%,80%,100%{transform:none;opacity:1}85%{transform:scale(.7);opacity:.6}90%{transform:scale(1.1)}}
@keyframes ytGlow{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.2);opacity:.18}}
@keyframes ytSpin{to{transform:rotate(360deg)}}
@keyframes ytSunBob{50%{transform:translateY(-5px)}}
@keyframes ytDrift{from{transform:translateX(-170px)}to{transform:translateX(560px)}}
@keyframes ytBob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-14px) rotate(10deg)}}
@keyframes ytOrbit{0%{transform:rotate(0) translateX(10px) rotate(0)}100%{transform:rotate(360deg) translateX(10px) rotate(-360deg)}}
@keyframes ytTwinkle{0%,100%{transform:scale(0) rotate(0);opacity:0}45%{transform:scale(1) rotate(45deg);opacity:1}70%{transform:scale(.3) rotate(90deg);opacity:.4}}
@keyframes ytFly{0%{transform:translate(-60px,0)}25%{transform:translate(70px,-14px)}50%{transform:translate(200px,6px)}75%{transform:translate(330px,-10px)}100%{transform:translate(470px,0)}}
@keyframes ytFlap{50%{transform:scaleY(.35)}}
@keyframes ytSway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes ytShine{0%,72%{transform:translateX(-140px) skewX(-20deg)}100%{transform:translateX(420px) skewX(-20deg)}}
@keyframes ytBtnPulse{0%,100%{transform:none;box-shadow:0 6px 0 #b4e4d8,0 12px 22px rgba(19,78,74,.4)}50%{transform:translateY(-3px);box-shadow:0 9px 0 #b4e4d8,0 16px 28px rgba(19,78,74,.35)}}
.yt-sky{animation:ytSky .8s ease-out both}
.yt-sunrise{animation:ytSunRise 1.6s cubic-bezier(.22,1,.36,1) both}
.yt-sunbob{animation:ytSunBob 6s ease-in-out 1.6s infinite}
.yt-glow{transform-box:fill-box;transform-origin:center;animation:ytGlow 5s ease-in-out infinite}
.yt-glow2{animation-delay:-2.5s}
.yt-rays{transform-box:fill-box;transform-origin:center;animation:ytSpin 40s linear infinite}
.yt-hill{animation:ytHillUp 1s cubic-bezier(.22,1,.36,1) both}
.yt-drop{transform-origin:50% 100%;animation:ytDrop 1.2s cubic-bezier(.3,0,.4,1) .9s both}
.yt-hop{transform-origin:50% 100%;animation:ytHop 7s ease-in-out 3.2s infinite}
.yt-shadow{transform-box:fill-box;transform-origin:center;animation:ytShadowIn 1.2s ease-out .9s both}
.yt-shadowhop{transform-box:fill-box;transform-origin:center;animation:ytHopShadow 7s ease-in-out 3.2s infinite}
.yt-float{animation:ytFloat 4s ease-in-out infinite}
.yt-blink{transform-box:fill-box;transform-origin:center;animation:ytBlink 5s ease-in-out infinite}
.yt-wave{transform-origin:144px 118px;animation:ytWaveLoop 7s ease-in-out 2.1s infinite}
.yt-title{transform-origin:50% 80%;animation:ytTitle .8s cubic-bezier(.34,1.56,.64,1) 1.7s both}
.yt-rise{animation:ytRise .7s ease-out both}
.yt-cloud{animation:ytDrift 48s linear infinite}
.yt-twinkle{animation:ytTwinkle 3.2s ease-in-out infinite}
.yt-fly{animation:ytFly 20s linear 3s infinite}
.yt-flap{transform-box:fill-box;transform-origin:center;animation:ytFlap .45s ease-in-out infinite}
.yt-sway{transform-box:fill-box;transform-origin:50% 100%;animation:ytSway 3s ease-in-out infinite}
.yt-shine{animation:ytShine 4.5s ease-in-out 3.4s infinite}
.yt-btnpulse{animation:ytRise .7s ease-out 2.6s both,ytBtnPulse 3s ease-in-out 3.4s infinite}
.yt-still,.yt-still *{animation:none!important}
@media (prefers-reduced-motion:reduce){.yt-scene,.yt-scene *{animation:none!important}}
.yt-btn:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}
</style>
