# CORS ของแอป Android (Capacitor) : origin ในแอป = https://localhost เท่านั้น
# Node-RED เปิด CORS "*" (methods ไม่มี PATCH) ให้ทุก path เองจาก editor-api เมื่อ editor เปิดอยู่ และไม่มีเลยเมื่อ editor ปิด
# → ซ่อน header ของ Node-RED ทั้งหมดแล้วตั้งเองที่นี่ (ไม่ขึ้นกับสถานะ editor) ; origin อื่น = ไม่ได้ ACAO (เว็บ same-origin ไม่ต้องใช้)
map $http_origin $yt_cors_origin {
  default "";
  "https://localhost" $http_origin;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # รูปซองยา base64 (ให้ตรงกับ apiMaxLength ของ Node-RED)
  client_max_body_size 12m;

  # REST API → Node-RED
  location /api/ {
    proxy_pass http://nodered:1880/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;            # OCR + LLM อาจใช้เวลา 10–20 วินาที

    # CORS (ดูหัวไฟล์) : ค่าว่าง = nginx ไม่ส่ง header นั้น
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
    add_header Access-Control-Allow-Origin $yt_cors_origin always;
    add_header Vary Origin always;

    # preflight ตอบที่นี่เลย (ไม่ส่งต่อ Node-RED) ; add_header ใน if ไม่สืบทอดจากข้างนอก จึงต้องใส่ซ้ำ
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $yt_cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, ngrok-skip-browser-warning" always;
      add_header Access-Control-Max-Age 600 always;
      add_header Vary Origin always;
      add_header Content-Length 0 always;
      return 204;
    }
  }

  # LINE webhook → Node-RED (URL ที่ใส่ใน LINE Developers Console: https://<tunnel>/line/webhook)
  location = /line/webhook {
    proxy_pass http://nodered:1880/line/webhook;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # รูปน้องยาตรงหลายท่าในข้อความ Flex ของ LINE (LINE_ASSET_BASE) — ชื่อไฟล์คงที่ จึงแคชสั้น (ไม่ immutable เหมือนไฟล์ที่มี hash)
  location ~ ^/line/mascot(-bell|-cheer|-hello)?[.]png$ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # Service worker และ manifest ห้ามแคช ไม่งั้น PWA ไม่อัปเดต
  location ~* (ngsw\.json|ngsw-worker\.js|manifest\.webmanifest)$ {
    default_type application/manifest+json;   # .webmanifest ไม่อยู่ใน mime.types ของ nginx (ngsw.json / .js ใช้ชนิดของตัวเอง)
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # ไฟล์ที่มี hash ในชื่อ แคชได้ยาว
  location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
