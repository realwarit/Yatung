server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # รูปซองยา base64 (ให้ตรงกับ apiMaxLength ของ Node-RED)
  client_max_body_size 12m;

  # REST API → Node-RED
  location /api/ {
    proxy_pass http://nodered:1880/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;            # OCR + LLM อาจใช้เวลา 10–20 วินาที
  }

  # LINE webhook → Node-RED (URL ที่ใส่ใน LINE Developers Console: https://<tunnel>/line/webhook)
  location = /line/webhook {
    proxy_pass http://nodered:1880/line/webhook;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Service worker และ manifest ห้ามแคช ไม่งั้น PWA ไม่อัปเดต
  location ~* (ngsw\.json|ngsw-worker\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # ไฟล์ที่มี hash ในชื่อ แคชได้ยาว
  location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
