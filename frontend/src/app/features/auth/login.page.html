<app-auth-shell title="ยินดีต้อนรับกลับมา" [wave]="true" lead="ดูตารางกินยาของคุณ" [mood]="mood()" [message]="message()" [bubble]="bubble()" [bubbleShort]="bubbleShort()" [peek]="showPassword()" [chatty]="chatty()">

  @if (error()) {
    <div class="yt-alert yt-alert--danger" role="alert">
      <app-icon name="alert" />
      <span>{{ error() }}</span>
    </div>
  }

  <form [formGroup]="form" data-kb-anchor (ngSubmit)="submit()" (focusin)="onFocusIn($event)" (focusout)="onFocusOut($event)" novalidate>
    <div class="yt-field">
      <label class="yt-label" for="email">อีเมล</label>
      <div class="yt-control" [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid">
        <app-icon name="mail" />
        <input id="email" type="email" formControlName="email" autocomplete="username" inputmode="email"
               placeholder="you&#64;mail.com"
               [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
               aria-describedby="email-error" />
      </div>
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <p class="yt-error-text" id="email-error"><app-icon name="alert" /> กรุณากรอกอีเมลให้ถูกต้อง เช่น name&#64;example.com</p>
      }
    </div>

    <div class="yt-field" data-first-screen="fields">
      <label class="yt-label" for="password">รหัสผ่าน</label>
      <div class="yt-control" [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid">
        <app-icon name="lock" />
        <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password"
               autocomplete="current-password"
               [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
               aria-describedby="password-error" />
        <button type="button" id="toggle-password" class="yt-control__action yt-control__action--icon" (click)="showPassword.set(!showPassword())"
                [attr.aria-pressed]="showPassword()" [attr.aria-label]="showPassword() ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน'"
                [title]="showPassword() ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน'">
          <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" />
        </button>
      </div>
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <p class="yt-error-text" id="password-error"><app-icon name="alert" /> กรุณากรอกรหัสผ่าน</p>
      }
    </div>

    <button mat-flat-button class="yt-submit" type="submit" data-first-screen="submit" [attr.aria-busy]="busy()">
      @if (busy()) { <mat-spinner diameter="24" /> กำลังเข้าสู่ระบบ… } @else { เข้าสู่ระบบ }
    </button>
  </form>

  <p class="switch">ยังไม่มีบัญชี? <a routerLink="/register">สมัครสมาชิก</a></p>
</app-auth-shell>
