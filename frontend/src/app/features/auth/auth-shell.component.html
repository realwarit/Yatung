<!-- ชั้นตกแต่งพื้นหลัง: blob พาสเทลล้นขอบจอ + ลายเม็ดยา/จุดจาง -->
<div class="bg" aria-hidden="true">
  <span class="bg__blob bg__tl"></span>
  <span class="bg__blob bg__br"></span>
  <span class="bg__blob bg__tr"></span>
  <svg class="bg__dots" focusable="false">
    <defs>
      <pattern id="yt-bg-pattern" width="112" height="112" patternUnits="userSpaceOnUse">
        <circle cx="14" cy="18" r="3" /><circle cx="86" cy="70" r="2.4" /><circle cx="40" cy="96" r="2" />
        <rect x="52" y="22" width="22" height="9" rx="4.5" transform="rotate(-30 63 26.500)" />
        <rect x="8" y="64" width="18" height="8" rx="4" transform="rotate(35 17 68)" />
        <rect x="84" y="6" width="16" height="7" rx="3.500" transform="rotate(20 92 9.500)" />
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#yt-bg-pattern)" />
  </svg>
</div>

<!-- แถวบน: โลโก้ชิดซ้าย ตัวปรับขนาดตัวอักษรชิดขวา (มือถือ = กะทัดรัด · ที่แคบ/ก++ ซ่อนคำ "ยาตรง" เหลือไอคอน) -->
<header class="top">
  <app-logo role="img" aria-label="ยาตรง" tone="light" [large]="true" [compact]="true" />
  <app-font-size-toggle [compact]="true" />
</header>

<div class="page">
  <div class="shell">
    <app-auth-stage class="stage" [mood]="mood()" [message]="message()" [peek]="peek()" [chatty]="chatty()" />

    <main class="content" data-size="l" data-short="0">
      <!-- มือถือ: น้องยาตรงโผล่หน้าจากหลังการ์ด มือเกาะขอบ + กล่องคำพูดขวาบน (1 บรรทัด ; ไม่พอ = ข้อความสั้น) ; จอกว้างอยู่ที่เวทีซ้าย -->
      <div class="peek">
        <div class="peek__mascot">
          <app-mascot [mood]="mood()" [peek]="peek()" [grip]="true" [fluid]="true" />
        </div>
        <app-speech-bubble class="peek__bubble b-long" tail="left" [typing]="false" [text]="bubble()" />
        <app-speech-bubble class="peek__bubble b-short" tail="left" [typing]="false" [text]="bubbleShort()" />
      </div>

      <div class="card yt-enter">
        <div class="hello">
          <h1 class="yt-title">{{ title() }}@if (wave()) {&nbsp;<app-wave-hand />}</h1>
          <p class="yt-lead">{{ lead() }}</p>
        </div>
        <ng-content />
      </div>

      <p class="tagline"><app-icon name="heart" /> ไม่ลืมกินยา ไม่กินผิดเวลา</p>
      <p class="yt-disclaimer"><span class="yt-nowrap">ไม่ใช่คำแนะนำทางการแพทย์</span></p>
    </main>
  </div>
</div>
