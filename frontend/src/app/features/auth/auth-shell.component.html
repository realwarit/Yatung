<div class="shell">
  <aside class="brand">
    <span class="blob blob--1" aria-hidden="true"></span>
    <span class="blob blob--2" aria-hidden="true"></span>
    <span class="blob blob--3" aria-hidden="true"></span>

    <app-logo tone="dark" />

    <div class="brand__body">
      <h2 class="brand__tagline">ไม่ลืมกินยา<br />ไม่กินผิดเวลา</h2>
      <ul class="features">
        <li><span class="features__icon"><app-icon name="camera" /></span> สแกนซองยา แล้วได้ตารางกินยาทันที</li>
        <li><span class="features__icon"><app-icon name="chat" /></span> เตือนผ่าน LINE ตรงเวลาทุกมื้อ</li>
        <li><span class="features__icon"><app-icon name="heart" /></span> ญาติอุ่นใจ รู้เมื่อลืมกินยา</li>
      </ul>
    </div>

    <div class="mascot mascot--wide">
      <p class="speech">สวัสดีค่ะ มาจัดตารางยากันเถอะ!</p>
      <app-mascot mood="wave" [size]="200" />
    </div>
  </aside>

  <div class="panel">
    <header class="top">
      <app-logo class="top__logo" tone="dark" />
      <app-font-size-toggle />
      <div class="mascot mascot--narrow">
        <app-mascot mood="wave" [size]="88" />
        <p class="speech">สวัสดีค่ะ มาจัดตารางยากันเถอะ!</p>
      </div>
    </header>

    <main class="content">
      <div class="card yt-enter">
        <ng-content />
      </div>
      <p class="yt-disclaimer">ไม่ใช่คำแนะนำทางการแพทย์</p>
    </main>
  </div>
</div>
