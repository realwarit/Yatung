<section class="progress" aria-label="ความคืบหน้าวันนี้" data-first-screen="progress">
  @if (allDone()) {
    <div class="cheer" data-first-screen="cheer">
      <app-mascot mood="celebrate" size="l" [decorative]="false" label="น้องยาตรงดีใจที่วันนี้กินยาครบแล้ว" />
      <p class="big" role="status">วันนี้กินครบแล้ว เก่งมากเลยค่ะ</p>
      <p class="sub"><span class="num">{{ taken() }} / {{ total() }}</span> รายการ</p>
    </div>
    <app-tts-button class="listen" variant="compact" label="ฟัง" ariaLabel="ฟังสรุปยาวันนี้" ttsKey="today-all" [build]="speak()" data-first-screen="listen" />
  } @else {
    <app-mascot class="mc" [mood]="mood()" size="s" />
    <div class="mid">
      @if (total() > 0) {
        <p class="line">
          <span class="lbl">วันนี้กินแล้ว</span>
          <span class="cnt"><span class="num n">{{ taken() }}</span> / <span class="num">{{ total() }}</span></span>
        </p>
        <div class="bar" role="progressbar" aria-label="ความคืบหน้ากินยาวันนี้" aria-valuemin="0" [attr.aria-valuemax]="total()" [attr.aria-valuenow]="taken()"><i [style.width.%]="pct()"></i></div>
      } @else {
        <p class="lbl none">วันนี้ไม่มีรอบกินยา</p>
      }
    </div>
    <app-tts-button class="listen" variant="compact" label="ฟัง" ariaLabel="ฟังยาที่ต้องกินวันนี้" ttsKey="today-all" [build]="speak()" data-first-screen="listen" />
  }
</section>
