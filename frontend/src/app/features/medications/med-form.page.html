<div class="yt-page form">
  <a class="back" routerLink="/medications"><app-icon name="chevron-down" class="back__ic" /> ยาของฉัน</a>
  <h1 class="yt-page-title">{{ isEdit() ? 'แก้ไขยา' : 'เพิ่มยา' }}</h1>

  @if (loading()) {
    <div class="yt-skeleton sk" aria-busy="true" aria-label="กำลังโหลดข้อมูลยา"></div>
  } @else {
    <form (submit)="$event.preventDefault(); save()" novalidate>
      @if (formError(); as fe) {
        <div class="yt-alert yt-alert--danger" role="alert"><app-icon name="alert" /> <span>{{ fe }}</span></div>
      }

      <app-med-fields [(draft)]="draft" [(moreOpen)]="moreOpen" [times]="times()" [errors]="errors()" (edited)="clearError($event)" />

      <!-- preview -->
      <section class="preview" aria-label="สรุปก่อนบันทึก">
        <p class="preview__cap"><app-icon name="info" /> ตรวจดูก่อนบันทึก</p>
        <p class="preview__text">{{ preview() }}</p>
      </section>

      <div class="actions">
        <a mat-stroked-button routerLink="/medications">ยกเลิก</a>
        <button mat-flat-button type="submit" [disabled]="saving()">{{ saving() ? 'กำลังบันทึก…' : 'บันทึก' }}</button>
      </div>
      <p class="yt-disclaimer">ไม่ใช่คำแนะนำทางการแพทย์ · กินยาตามที่แพทย์หรือเภสัชกรสั่งเท่านั้น</p>
    </form>
  }
</div>
