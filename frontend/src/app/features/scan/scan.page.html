<div class="scan">
  <!-- Ionic: ion-header / ion-toolbar (พื้นโปร่งใส) / ion-buttons / ion-button / ion-title / ion-icon -->
  <ion-header class="ion-no-border" mode="md">
    <ion-toolbar mode="md">
      <ion-buttons slot="start">
        <ion-button class="back" routerLink="/today" aria-label="กลับหน้าหลัก">
          <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
      <ion-title>เพิ่มยาใหม่</ion-title>
    </ion-toolbar>
  </ion-header>

  <ol class="steps" id="scan-steps" aria-label="ขั้นตอนการเพิ่มยา">
    <li class="s is-current" aria-current="step"><span class="dot num">1</span><span class="t">ถ่ายรูป</span></li>
    <li class="s"><span class="dot num">2</span><span class="t">ตรวจข้อมูล</span></li>
    <li class="s"><span class="dot num">3</span><span class="t">บันทึก</span></li>
  </ol>

  <app-scan-stage
    [mode]="mode()" [phase]="phase()" [desktop]="desktop()" [dragging]="dragging()"
    [previewUrl]="previewUrl()" [imageInfo]="imageInfo()" [warnings]="warnings()"
    [text]="manualText()" [errorMessage]="errorMessage()" [step]="step()"
    (modeChange)="onModeChange($event)" (textChange)="manualText.set($event)"
    (upload)="upload()" (camera)="pick('camera')" (gallery)="pick('gallery')"
    (rotate)="rotate()" (clear)="clearImage()" (submit)="submit()" (cancel)="cancel()"
    (retry)="retry()" (switchToText)="switchToText()" (dismissError)="dismissError()" />

  <!-- error ระดับระบบ (เน็ตหลุด, 401, เปิดกล้องไม่ได้, ไฟล์ไม่ใช่รูป) -->
  <ion-toast
    [isOpen]="!!toastMessage()"
    [message]="toastMessage() ?? ''"
    [duration]="4500"
    color="danger"
    position="top"
    positionAnchor="scan-steps"
    (didDismiss)="toastMessage.set(null)"
  ></ion-toast>
</div>
