<div class="sky"></div>

@for (c of clouds; track $index) {
  <div class="cloud" [style.top.%]="c.top" [style.opacity]="c.op" [style.animation-duration.s]="c.dur" [style.animation-delay.s]="c.delay">
    <svg [attr.width]="c.w" [attr.height]="c.w * 0.433" viewBox="0 0 120 52"><path d="M22 50a16 16 0 0 1 0-32 24 24 0 0 1 44-8 18 18 0 0 1 30 12 14 14 0 0 1 4 28z"/></svg>
  </div>
}

<div class="bird">
  <svg width="40" height="20" viewBox="0 0 40 20">
    <g class="flap"><path d="M2 8Q7 2 12 8Q17 2 22 8" stroke-width="2.2"/></g>
    <g class="flap f2"><path d="M20 16Q24 11 28 16Q32 11 36 16" stroke-width="2"/></g>
  </svg>
</div>

<div class="col">
  <div class="sunrise">
    <div class="sunbob">
      <svg viewBox="0 0 140 140">
        <circle class="glow" cx="70" cy="70" r="58"/>
        <circle class="glow g2" cx="70" cy="70" r="46"/>
        <g class="rays">
          <line x1="70" y1="20" x2="70" y2="30"/><line x1="70" y1="110" x2="70" y2="120"/>
          <line x1="20" y1="70" x2="30" y2="70"/><line x1="110" y1="70" x2="120" y2="70"/>
          <line x1="41.7" y1="41.7" x2="34.6" y2="34.6"/><line x1="98.3" y1="41.7" x2="105.4" y2="34.6"/>
          <line x1="41.7" y1="98.3" x2="34.6" y2="105.4"/><line x1="98.3" y1="98.3" x2="105.4" y2="105.4"/>
        </g>
        <circle class="disc" cx="70" cy="70" r="31"/>
        <g class="blink"><path class="face" d="M59 67Q62 63 65 67M75 67Q78 63 81 67"/></g>
        <path class="face" d="M63 76Q70 82 77 76"/>
        <ellipse class="cheek" cx="57" cy="75" rx="4" ry="2.5"/><ellipse class="cheek" cx="83" cy="75" rx="4" ry="2.5"/>
      </svg>
    </div>
  </div>

  @for (t of twinkles; track $index) {
    <div class="twinkle" [class.white]="t.white" [style.left.%]="t.x" [style.top.%]="t.y" [style.width.px]="t.s" [style.animation-delay.s]="t.delay">
      <svg viewBox="-12 -12 24 24"><path d="M0-11L3-3L11 0L3 3L0 11L-3 3L-11 0L-3-3Z"/></svg>
    </div>
  }

  @for (f of floaters; track $index) {
    <div class="fl" [style.left.%]="f.x" [style.top.%]="f.y" [style.animation-delay.s]="f.pop">
      <div [class]="'lp ' + f.loop" [style.animation-duration.s]="f.dur" [style.animation-delay.s]="f.delay">
        @switch (f.kind) {
          @case ('cap-pink') { <svg class="cap rot-l" width="46" height="22" viewBox="-1 -1 46 22"><path class="c1" d="M10 0H22V20H10A10 10 0 0 1 10 0Z"/><path class="c2" d="M22 0H34A10 10 0 0 1 34 20H22Z"/><rect x="0" y="0" width="44" height="20" rx="10"/></svg> }
          @case ('cap-mint') { <svg class="cap rot-r mint" width="30" height="20" viewBox="-1 -1 46 22"><path class="c1" d="M10 0H22V20H10A10 10 0 0 1 10 0Z"/><path class="c2" d="M22 0H34A10 10 0 0 1 34 20H22Z"/><rect x="0" y="0" width="44" height="20" rx="10"/></svg> }
          @case ('pill') { <svg class="pill" width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="12"/><path d="M8 15H22"/></svg> }
          @case ('heart') { <svg class="heart" width="30" height="28" viewBox="2 2 20 20"><path d="M12 20s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 9c0 5.8-8 11-8 11z"/></svg> }
          @case ('star') { <svg class="fstar" width="24" height="24" viewBox="-14 -14 28 28"><path d="M0-11L3.5-3.5L11 0L3.5 3.5L0 11L-3.5 3.5L-11 0L-3.5-3.5Z"/></svg> }
        }
      </div>
    </div>
  }
</div>

<app-welcome-hills />
