<section class="hero yt-card" aria-label="อัตราการกินยา">
  <div class="row">
    <svg class="ring" [class.complete]="rate() === 100" viewBox="0 0 120 120" role="img" [attr.aria-label]="ringLabel()">
      <circle class="track" cx="60" cy="60" [attr.r]="r" />
      @if (rate() !== null) {
        <circle class="bar" cx="60" cy="60" [attr.r]="r" [attr.stroke-dasharray]="dash()" transform="rotate(-90 60 60)" />
      }
      <text x="60" y="62" text-anchor="middle" dominant-baseline="middle" class="big">{{ rate() === null ? '–' : rate() }}@if (rate() !== null) {<tspan class="pct">%</tspan>}</text>
      <text x="60" y="88" text-anchor="middle" dominant-baseline="middle" class="unit">{{ days() }} วัน</text>
    </svg>
    <app-mascot [mood]="level().mood" [size]="96" />
  </div>
  <p class="say">{{ level().text }}</p>
  @if (due() > 0) {
    <p class="sub">กินแล้ว <span class="num">{{ taken() }}</span> จาก <span class="num">{{ due() }}</span> ครั้ง</p>
  }
  @if (streak() > 0) {
    <p class="chip"><app-icon name="check" /> กินครบติดกัน <span class="num">{{ streak() }}</span> วัน</p>
  }
</section>
