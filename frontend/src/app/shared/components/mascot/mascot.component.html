<svg viewBox="0 0 200 216" [attr.width]="size()" [attr.height]="height()" focusable="false"
     [attr.role]="decorative() ? null : 'img'"
     [attr.aria-label]="decorative() ? null : ariaLabel()"
     [attr.aria-hidden]="decorative() ? 'true' : null">
  <ellipse class="shadow" cx="100" cy="206" rx="38" ry="5" />

  <g class="bounce"><g class="float">
    <!-- ขา -->
    <rect class="limb o" x="68" y="158" width="26" height="38" rx="13" />
    <rect class="limb o" x="106" y="158" width="26" height="38" rx="13" />

    <!-- ตัวแคปซูล: ครึ่งบน / ครึ่งล่าง / เส้นแบ่ง / ขอบ -->
    <path class="top" d="M52 96V82a48 48 0 0 1 96 0v14z" />
    <path class="bottom" d="M52 96v30a48 48 0 0 0 96 0V96z" />
    <path class="shine" d="M70 80Q70 60 86 52" />
    <path class="o" d="M52 96h96" />
    <rect class="o" x="52" y="34" width="96" height="140" rx="48" />

    <!-- แก้ม (ทุก mood) -->
    <ellipse class="cheek" cx="66" cy="138" rx="8" ry="5" />
    <ellipse class="cheek" cx="134" cy="138" rx="8" ry="5" />

    <!-- ตา -->
    @switch (mood()) {
      @case ('sleepy') { <path class="o f0 pose" d="M73 121Q82 130 91 121M109 121Q118 130 127 121" /> }
      @case ('celebrate') { <path class="o f0 pose" d="M73 125Q82 112 91 125M109 125Q118 112 127 125" /> }
      @default {
        @if (showEyes()) {
          <g class="look" [style.transform]="look()"><g class="eyes">
            <circle class="ink" cx="82" cy="122" r="9" /><circle class="hl" cx="85" cy="119" r="3" />
            <circle class="ink" cx="118" cy="122" r="9" /><circle class="hl" cx="121" cy="119" r="3" />
          </g></g>
        }
      }
    }
    @if (mood() === 'worried') { <path class="o f0 pose" d="M72 111L91 105M128 111L109 105" /> }

    <!-- ปาก -->
    @switch (mood()) {
      @case ('celebrate') {
        <path class="ink o2 pose" d="M88 136Q100 158 112 136Z" />
        <ellipse class="cheek" cx="100" cy="144.5" rx="5" ry="3" />
      }
      @case ('thinking') { <circle class="o f0 pose" cx="104" cy="141" r="3.5" /> }
      @case ('sleepy') { <path class="o f0 pose" d="M95 140Q100 143 105 140" /> }
      @case ('worried') { <path class="o f0 pose" d="M90 143Q95 137 100 143T110 143" /> }
      @default { <path class="o f0 pose" d="M91 137Q100 146 109 137" /> }
    }

    <!-- แขน (d เปลี่ยนแบบนุ่มใน browser ที่รองรับ CSS d) -->
    <path class="arm-o" [attr.d]="arms()[0]" [style.d]="path(arms()[0])" />
    <path class="arm-f" [attr.d]="arms()[0]" [style.d]="path(arms()[0])" />
    <g [class.wave]="mood() === 'wave'">
      <path class="arm-o" [attr.d]="arms()[1]" [style.d]="path(arms()[1])" />
      <path class="arm-f" [attr.d]="arms()[1]" [style.d]="path(arms()[1])" />
    </g>

    <!-- ของประกอบตาม mood -->
    @switch (mood()) {
      @case ('thinking') {
        <circle class="prop o2 pose" cx="150" cy="66" r="3.5" />
        <circle class="prop o2 pose" cx="157" cy="56" r="5" />
        <ellipse class="prop o2 pose" cx="172" cy="34" rx="24" ry="16" />
        <circle class="ink" cx="162" cy="34" r="3.2" /><circle class="ink" cx="172" cy="34" r="3.2" /><circle class="ink" cx="182" cy="34" r="3.2" />
      }
      @case ('reminder') {
        @for (d of bellRing; track d) { <path class="halo" [attr.d]="d" /><path class="halo-f" [attr.d]="d" /> }
        <g class="pose" transform="translate(166 62)">
          <path class="bell o2" d="M-15 14H15Q13 14 13 6Q13 -10 0 -10Q-13 -10 -13 6Q-13 14 -15 14Z" />
          <circle class="ink" cx="0" cy="19" r="4" />
        </g>
      }
      @case ('sleepy') {
        @for (d of sleepZ; track d) { <path class="halo" [attr.d]="d" /><path class="halo-f" [attr.d]="d" /> }
      }
      @case ('worried') {
        <path class="sweat o2 pose" d="M152 82q-8 12-8 17a8 8 0 0 0 16 0q0-5-8-17z" />
      }
      @case ('celebrate') {
        @for (s of stars; track $index) {
          <path class="star o2" [attr.transform]="'translate(' + s[0] + ' ' + s[1] + ') scale(' + s[2] + ')'"
                d="M0-11L3.5-3.5L11 0L3.5 3.5L0 11L-3.5 3.5L-11 0L-3.5-3.5Z" />
        }
        @for (c of confetti; track $index) {
          <rect class="o2" [class]="'conf-' + c[3]" x="-5" y="-3" width="10" height="6" rx="2"
                [attr.transform]="'translate(' + c[0] + ' ' + c[1] + ') rotate(' + c[2] + ')'" />
        }
      }
    }
  </g></g>
</svg>
